<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Red Rooster Restaurant: ventas, inventario y analítica predictiva (demanda, venta cruzada, segmentación RFM y asesor con IA). Suba Fontanar, Bogotá." />
    <meta name="theme-color" content="#151313" />
    <title>Red Rooster · Gestión y analítica</title>
    <!-- Fuentes de marca locales (public/fonts): Big Noodle Titling para títulos y precios -->
    <link rel="preload" href="/fonts/big_noodle_titling.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Barlow: texto de lectura del manual. Barlow Condensed: cifras y etiquetas. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&display=swap" />
    <script>
      // Aplica el tema guardado antes del primer pintado para evitar el destello
      try {
        var t = localStorage.getItem('mn-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
